<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Minha Rotina">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Minha Rotina</title>
<style>
:root{--bg:#0d0f0e;--card:#171a19;--line:#262b29;--tx:#f2f5f3;--mu:#8b9490;--g:#3ddc97}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0}
main{padding:16px 16px calc(90px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:28px;margin:8px 0 2px}h2{font-size:18px;margin:22px 0 10px}
.mu{color:var(--mu);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.big{font-size:44px;font-weight:700;color:var(--g)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
.task input{width:26px;height:26px;accent-color:var(--g);flex:none;margin-top:2px}.task.done b{color:var(--mu);text-decoration:line-through}
.ic{position:relative;width:46px;height:46px;flex:none;border-radius:14px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px solid #3a413e;transition:.2s}.task.done .ic{border-color:var(--g);background:#1d3a2e}.task.done .ic::after{content:'✓';position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#06150e;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}.task{cursor:pointer}.ic{color:var(--tx)}.ic svg{width:24px;height:24px}.task.done .ic{color:var(--g)}
.task small{display:block;color:var(--mu)}.opt{font-size:12px;color:var(--g)}
button,.btn{background:var(--g);color:#06150e;border:0;border-radius:14px;padding:14px 18px;font:600 16px inherit;font-family:inherit;min-height:48px}
button.s{background:var(--line);color:var(--tx)}
input,textarea,select{width:100%;background:#0d0f0e;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:16px inherit;font-family:inherit}
textarea{min-height:80px}label{display:block;margin:12px 0 4px;color:var(--mu);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#121413ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 0;min-height:50px}nav button.on{color:var(--g)}nav span{display:flex;justify-content:center;margin-bottom:3px}nav svg{width:24px;height:24px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.d{aspect-ratio:1;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--line)}
.d.full{background:var(--g);color:#06150e;font-weight:700}.d.part{border-color:var(--g)}.d.today{outline:2px solid var(--tx)}
.cols{display:flex;align-items:flex-end;gap:8px;height:110px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.cols i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
.dayb{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border-radius:9px;background:var(--line);font-size:13px;margin:2px}.dayb.on{background:var(--g);color:#06150e}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
/* ===== Minha Rotina — dados 100% locais (localStorage). Sem servidor, sem login. ===== */
const $=s=>document.querySelector(s),K='mr_v1',DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],ALL=[0,1,2,3,4,5,6],WK=[1,2,3,4,5];
const ICONS={
sol:'<path d="M3 18h18M7 18a5 5 0 0110 0M12 5v3M5.5 9.5l1.8 1.8M18.5 9.5l-1.8 1.8"/>',
alongar:'<circle cx="12" cy="5" r="2"/><path d="M12 8v6M5 10l7 1 7-1M9 21l3-7 3 7"/>',
pulso:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
chuveiro:'<path d="M5 11a7 7 0 0114 0zM8 15v2M12 15v3M16 15v2M10 21v-1M14 21v-1"/>',
xicara:'<path d="M5 9h11v5a4 4 0 01-4 4H9a4 4 0 01-4-4zM16 10h1.5a2.5 2.5 0 010 5H16M8 3v3M12 3v3"/>',
camisa:'<path d="M8 3L3 6l2 4 3-1v11h8V9l3 1 2-4-5-3c-.5 1.5-2 2-4 2S8.5 4.5 8 3z"/>',
onibus:'<rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16M7 20v-3M17 20v-3"/>',
tigela:'<path d="M4 11h16a8 8 0 01-16 0zM9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/>',
maca:'<path d="M12 8c-2-2-7-1-7 4 0 4 3 8 5 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-5-5-6-7-4zM12 8c0-2 1-4 3-4"/>',
maleta:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/>',
casa:'<path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6"/>',
halter:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',
ondas:'<path d="M3 9c3-3 6 3 9 0s6-3 9 0M3 15c3-3 6 3 9 0s6-3 9 0"/>',
zzz:'<path d="M5 6h6l-6 6h6M13 13h5l-5 5h5"/>',
garfo:'<path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"/>',
mochila:'<path d="M8 6a4 4 0 018 0M6 8h12a1 1 0 011 1v11H5V9a1 1 0 011-1zM9 14h6"/>',
livro:'<path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/>',
lua:'<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>',
check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'},
NV={cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',barras:'<path d="M5 20v-8M12 20V5M19 20v-5"/>',ajustes:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'},
svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||NV[k]||ICONS.check}</svg>`;
const e=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';');
// id, hora, nome, detalhes, dias, opcional
const DEF=[['a','05:00','Acordar','Beber água\nArrumar a cama\nHigiene pessoal\nCompressa fria no rosto',ALL,0],
['mb','05:05','Mobilidade','Mobilidade articular e alongamento leve (5 minutos)',ALL,0],
['c','05:10','Cardio em jejum','Caminhada de cerca de 20 minutos, em jejum',ALL,0],['p','05:35','Banho e cuidados pessoais','Banho\nLimpeza facial\nHidratante\nProtetor solar',ALL,0],
['b','05:55','Café da manhã','3 ovos\n2 fatias de pão integral\nBanana com aveia\nCafé ou leite',ALL,0],
['t','06:10','Preparação para o trabalho','Vestir-se\nEscovar os dentes\nConferir marmita, lanche, carteira e celular',WK,0],
['o','06:30','Sair de casa','Pegar o ônibus para o trabalho',WK,0],['l','11:30','Almoço','Comer a marmita\nBeber água',ALL,0],
['s','15:00','Lanche da tarde','Iogurte com banana e aveia ou sanduíche com ovos\nBeber água',ALL,0],['x','17:00','Saída do trabalho','Voltar para casa',WK,0],
['h','19:00','Chegada em casa','Trocar de roupa\nBeber água\nLanche, se necessário',WK,0],
['m1','19:15','Musculação','',[1,2,4],0],['r','19:15','Recuperação','Alongar e descansar',[3],0],['m2','19:15','Musculação ou descanso','',[5],1],
['m3','19:15','Academia e lazer','',[6],0],['z','19:15','Descanso','',[0],0],
['j','20:00','Jantar','Proteína\nArroz ou batata\nLegumes e verduras',ALL,0],['n','20:25','Preparar o próximo dia','Separar roupa\nOrganizar marmita\nPreparar lanche\nArrumar mochila',ALL,0],
['d','20:40','Desenvolvimento pessoal','10 minutos de leitura\nPlanejar o próximo dia',ALL,0],['w','21:00','Dormir','Desligar telas\nPreparar o ambiente\nDormir cerca de 8 horas',ALL,0]]
.map(([id,time,name,sub,days,opt])=>({id,time,name,sub,days,opt}));
let S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:DEF,days:{},cfg:{goal:8,rem:false}},V='hoje',cal=new Date(),fired='';
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const IC={a:'sol',mb:'alongar',c:'pulso',p:'chuveiro',b:'xicara',t:'camisa',o:'onibus',l:'tigela',s:'maca',x:'maleta',h:'casa',m1:'halter',r:'ondas',m2:'halter',m3:'halter',z:'zzz',j:'garfo',n:'mochila',d:'livro',w:'lua'};
// Migração v2: atualiza horários/nomes das tarefas padrão sem apagar seus dados
if((S.v||0)<2){const P={c:[0,'Cardio em jejum','Caminhada de cerca de 20 minutos, em jejum'],p:['05:35'],b:['05:55'],t:['06:10'],m3:[0,'Academia e lazer'],d:[0,0,'10 minutos de leitura\nPlanejar o próximo dia']};
S.tasks.forEach(t=>{const p=P[t.id];if(p){if(p[0])t.time=p[0];if(p[1])t.name=p[1];if(p[2])t.sub=p[2]}});S.v=2;save()}
// Migração v3: cardio todos os dias + mobilidade após acordar
if(S.v<3){const c=S.tasks.find(t=>t.id=='c');if(c)c.days=ALL;if(!S.tasks.some(t=>t.id=='mb'))S.tasks.push({id:'mb',time:'05:05',name:'Mobilidade',sub:'Mobilidade articular e alongamento leve (5 minutos)',days:ALL,opt:0});S.v=3;save()}
S.tasks.forEach(t=>{if(!t.ic)t.ic=IC[t.id]||'check'});save();
const key=d=>d.toLocaleDateString('sv'),G=k=>S.days[k]||{done:[],water:0,sleep:'',diary:{}},W=k=>S.days[k]||(S.days[k]={done:[],water:0,sleep:'',diary:{}});
const tf=d=>S.tasks.filter(t=>t.days.includes(d.getDay())).sort((a,b)=>a.time.localeCompare(b.time));
const pct=d=>{const r=tf(d).filter(t=>!t.opt);if(!r.length)return 0;const g=G(key(d));return Math.round(r.filter(t=>g.done.includes(t.id)).length/r.length*100)};
const did=(d,re)=>tf(d).some(t=>re.test(t.id)&&G(key(d)).done.includes(t.id));
const QU=['Pequenos passos todos os dias constroem grandes resultados.','Consistência vence intensidade.','Faça o simples, faça hoje.','Seu futuro agradece o que você faz agora.','Um dia de cada vez.','Disciplina é cuidar de você.','Comece. O resto vem.'];
function render(){const n=new Date(),k=key(n),g=G(k),L=tf(n);let h='';
if(V=='hoje'){const hr=n.getHours(),sd=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite',hm=n.toTimeString().slice(0,5),nx=L.find(t=>!g.done.includes(t.id)&&t.time>=hm)||L.find(t=>!g.done.includes(t.id)),p=pct(n);
h=`<h1>${sd}!</h1><div class="mu">${n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · <span id="clk">${n.toLocaleTimeString('pt-BR')}</span></div>
<div class="card"><div class="row"><div class="big">${p}%</div><div class="mu">da rotina de hoje</div></div><div class="bar"><i style="width:${p}%"></i></div>${nx?`<p class="mu">Próxima: <b style="color:var(--tx)">${nx.time} ${e(nx.name)}</b></p>`:'<p class="mu">Tudo concluído por hoje.</p>'}</div>
<div class="card mu">${QU[n.getDate()%QU.length]}</div>
<div class="card">${L.map(t=>`<div class="task ${g.done.includes(t.id)?'done':''}" onclick="tg('${t.id}')"><span class="ic">${svg(t.ic)}</span><span><b>${t.time} ${e(t.name)}</b> ${t.opt?'<span class="opt">opcional</span>':''}<small>${e(t.sub).replace(/\n/g,' · ')}</small></span></div>`).join('')||'<p class="mu">Nenhuma tarefa hoje. Adicione em Ajustes.</p>'}</div>
<div class="card"><div class="row"><button class="s" onclick="wt(-1)">−</button><div style="text-align:center"><div class="big">${g.water}</div><div class="mu">de ${S.cfg.goal} copos</div></div><button onclick="wt(1)">+</button></div>
<label>Horas de sono (noite passada)</label><input type="number" step=".5" min="0" max="16" value="${g.sleep}" onchange="W('${k}').sleep=this.value;save()"></div>`}
if(V=='cal'){const y=cal.getFullYear(),m=cal.getMonth(),f=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();let c=DN.map(d=>`<div class="mu">${d[0]}</div>`).join('')+'<div></div>'.repeat(f);
for(let i=1;i<=nd;i++){const d=new Date(y,m,i),kk=key(d),has=S.days[kk]&&G(kk).done.length,p=pct(d);c+=`<div class="d ${p==100?'full':has?'part':''} ${kk==k?'today':''}" onclick="sd('${kk}')">${i}</div>`}
const ws=new Date(n);ws.setDate(n.getDate()-n.getDay());h=`<h1>Calendário</h1><h2>Esta semana</h2><div class="grid">${ALL.map(i=>{const d=new Date(ws);d.setDate(ws.getDate()+i);const p=pct(d);return `<div class="d ${p==100?'full':p?'part':''}" style="flex-direction:column;font-size:12px" onclick="sd('${key(d)}')">${DN[i]}<b>${p}%</b></div>`}).join('')}</div>
<h2><span class="row"><button class="s" onclick="cm(-1)">‹</button><span style="text-align:center;flex:3">${cal.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span><button class="s" onclick="cm(1)">›</button></span></h2><div class="grid">${c}</div><p class="mu">Verde: rotina completa. Contorno verde: parcial.</p><div id="det"></div>`}
if(V=='prog'){const ds=[...Array(7)].map((_,i)=>{const d=new Date(n);d.setDate(n.getDate()-6+i);return d}),reg=ds.filter(d=>S.days[key(d)]);
const bars=(f,mx,u='')=>`<div class="cols">${ds.map(d=>{const v=f(d);return `<div><i style="height:${Math.min(100,v/mx*100)}%"></i>${v?v+u:''}<br>${DN[d.getDay()]}</div>`}).join('')}</div>`;
const sl=ds.map(d=>parseFloat(G(key(d)).sleep)).filter(x=>x>0),tr=ds.filter(d=>did(d,/^m/)).length;
h=`<h1>Progresso</h1><p class="mu">Últimos 7 dias. Só aparece o que você registrou.</p>
<div class="card"><b>Consistência</b>${bars(pctd=>pct(pctd),100,'%')}<p class="mu">Dias completos: ${ds.filter(d=>pct(d)==100).length} de 7</p></div>
<div class="card"><b>Água (copos)</b>${bars(d=>G(key(d)).water,Math.max(S.cfg.goal,1))}</div>
<div class="card"><b>Sono (horas)</b>${bars(d=>parseFloat(G(key(d)).sleep)||0,10,'h')}<p class="mu">Média: ${sl.length?(sl.reduce((a,b)=>a+b)/sl.length).toFixed(1)+'h':'sem registros'}</p></div>
<div class="card"><b>Treinos</b><p>${tr} musculações · ${ds.filter(d=>did(d,/^c$/)).length} cardios · ${ds.filter(d=>did(d,/^d$/)).length} leituras</p></div>`}
if(V=='cfg'){h=`<h1>Ajustes</h1><div class="card"><label>Meta de água (copos)</label><input type="number" min="1" value="${S.cfg.goal}" onchange="S.cfg.goal=+this.value||8;save()">
<label class="row" style="margin-top:14px"><span>Lembretes (app aberto)</span><input type="checkbox" style="flex:none;width:28px" ${S.cfg.rem?'checked':''} onchange="rem(this.checked)"></label>
<p class="mu">No iPhone, o app só avisa enquanto está aberto. Para alertas com o app fechado, exporte para o Calendário:</p><button class="s" onclick="ics()">Exportar lembretes (.ics)</button></div>
<h2>Tarefas</h2>${S.tasks.map((t,i)=>`<div class="card"><div class="row"><select style="flex:0 0 104px" onchange="ed(${i},'ic',this.value)">${Object.keys(ICONS).map(k=>`<option ${t.ic==k?'selected':''}>${k}</option>`).join('')}</select><input type="time" value="${t.time}" onchange="ed(${i},'time',this.value)"><input value="${e(t.name)}" onchange="ed(${i},'name',this.value)"></div>
<label>Detalhes / refeição (um por linha)</label><textarea onchange="ed(${i},'sub',this.value)">${e(t.sub)}</textarea><div>${ALL.map(d=>`<span class="dayb ${t.days.includes(d)?'on':''}" onclick="dy(${i},${d})">${DN[d]}</span>`).join('')}</div>
<div class="row" style="margin-top:8px"><label class="row" style="margin:0"><input type="checkbox" style="flex:none;width:24px" ${t.opt?'checked':''} onchange="ed(${i},'opt',this.checked)"> opcional</label><button class="s" onclick="del(${i})">Excluir</button></div></div>`).join('')}
<button onclick="add()" style="width:100%">+ Nova tarefa</button><h2>Backup</h2><div class="card"><p class="mu">Seus dados ficam só neste aparelho. Exporte de vez em quando.</p><div class="row"><button class="s" onclick="ex()">Exportar</button><button class="s" onclick="$('#imp').click()">Importar</button></div><input id="imp" type="file" accept=".json" hidden onchange="im(this.files[0])"></div>`}
$('#app').innerHTML=h;
$('#nav').innerHTML=[['hoje','check','Hoje'],['cal','cal','Calendário'],['prog','barras','Progresso'],['cfg','ajustes','Ajustes']].map(([v,i,t])=>`<button class="${V==v?'on':''}" onclick="V='${v}';render();scrollTo(0,0)"><span>${svg(i)}</span>${t}</button>`).join('')}
function tg(id){const g=W(key(new Date()));g.done=g.done.includes(id)?g.done.filter(x=>x!=id):[...g.done,id];save();render()}
function wt(d){const g=W(key(new Date()));g.water=Math.max(0,g.water+d);save();render()}
function cm(d){cal.setMonth(cal.getMonth()+d);render()}
function sd(k){const g=G(k),d=new Date(k+'T12:00');$('#det').innerHTML=`<div class="card"><b>${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</b><p>Rotina: ${pct(d)}% · Água: ${g.water} copos · Sono: ${g.sleep?g.sleep+'h':'—'}</p></div>`}
function ed(i,f,v){S.tasks[i][f]=v;save()}
function dy(i,d){const a=S.tasks[i].days;S.tasks[i].days=a.includes(d)?a.filter(x=>x!=d):[...a,d];save();render()}
function del(i){if(confirm('Excluir esta tarefa?')){S.tasks.splice(i,1);save();render()}}
function add(){S.tasks.push({id:'u'+Date.now(),time:'12:00',name:'Nova tarefa',ic:'check',sub:'',days:ALL,opt:0});save();render()}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function ex(){dl('minha-rotina-backup-'+key(new Date())+'.json',JSON.stringify(S),'application/json')}
function im(f){f&&f.text().then(t=>{try{const d=JSON.parse(t);if(!d.tasks)throw 0;S=d;save();render();alert('Backup importado.')}catch{alert('Arquivo inválido.')}})}
function ics(){const B=['SU','MO','TU','WE','TH','FR','SA'],t0=key(new Date()).replace(/-/g,'');let o='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MinhaRotina//PT\r\n';
S.tasks.forEach(t=>{o+=`BEGIN:VEVENT\r\nUID:${t.id}@rotina\r\nDTSTAMP:${t0}T000000Z\r\nDTSTART:${t0}T${t.time.replace(':','')}00\r\nDURATION:PT10M\r\nRRULE:FREQ=WEEKLY;BYDAY=${t.days.map(d=>B[d]).join(',')}\r\nSUMMARY:${t.name}\r\nBEGIN:VALARM\r\nTRIGGER:PT0S\r\nACTION:DISPLAY\r\nDESCRIPTION:${t.name}\r\nEND:VALARM\r\nEND:VEVENT\r\n`});dl('minha-rotina.ics',o+'END:VCALENDAR','text/calendar')}
async function rem(on){if(on&&'Notification' in window&&await Notification.requestPermission()!='granted')on=false;if(on&&!('Notification' in window)){alert('Notificações exigem o app instalado na tela inicial (iOS 16.4+).');on=false}S.cfg.rem=on;save();render()}
setInterval(()=>{const n=new Date(),c=$('#clk');if(c)c.textContent=n.toLocaleTimeString('pt-BR');const hm=n.toTimeString().slice(0,5);
if(S.cfg.rem&&'Notification' in window&&Notification.permission=='granted'&&fired!=hm){fired=hm;tf(n).filter(t=>t.time==hm).forEach(t=>navigator.serviceWorker.ready.then(r=>r.showNotification('Minha Rotina',{body:t.time+' — '+t.name,icon:'icon-192.png'})))}},1000);
